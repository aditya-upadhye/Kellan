name: matchlens

infra:
  provider: bicep
  path: infra
  module: main

services:
  api:
    project: .
    language: docker
    host: containerapp
    resourceName: kellan-api
    docker:
      path: ./backend/Dockerfile
      context: .
      image: api
      remoteBuild: true
  web:
    project: .
    language: docker
    host: containerapp
    resourceName: kellan-web
    docker:
      path: ./frontend/Dockerfile
      context: .
      image: web
      remoteBuild: true
