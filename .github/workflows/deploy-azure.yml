name: Azure deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-deployment-${{ vars.AZURE_ENV_NAME }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Provision and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_COSMOS_LOCATION: ${{ vars.AZURE_COSMOS_LOCATION || vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          : "${AZURE_CLIENT_ID:?Set the AZURE_CLIENT_ID repository variable}"
          : "${AZURE_TENANT_ID:?Set the AZURE_TENANT_ID repository variable}"
          : "${AZURE_SUBSCRIPTION_ID:?Set the AZURE_SUBSCRIPTION_ID repository variable}"
          : "${AZURE_ENV_NAME:?Set the AZURE_ENV_NAME repository variable}"
          : "${AZURE_LOCATION:?Set the AZURE_LOCATION repository variable}"
          : "${AZURE_COSMOS_LOCATION:?Set AZURE_COSMOS_LOCATION or AZURE_LOCATION}"
          : "${AZURE_RESOURCE_GROUP:?Set the AZURE_RESOURCE_GROUP repository variable}"
          if (( ${#AZURE_ENV_NAME} < 2 || ${#AZURE_ENV_NAME} > 8 )); then
            echo "AZURE_ENV_NAME must be 2 to 8 characters to satisfy the Bicep parameter constraint."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@634ad924cf8baef2257898ba5663be8d19f15aca # v2.3.0
        with:
          version: 1.35.1

      - name: Sign in to Azure with OIDC
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"

      - name: Create azd environment
        run: |
          azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" \
            --no-prompt
          azd env set AZURE_COSMOS_LOCATION "$AZURE_COSMOS_LOCATION"
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"

      - name: Provision infrastructure without cached deployment state
        run: azd provision --environment "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt --no-state

      - name: Verify Container Apps registry identities
        shell: bash
        run: |
          set -euo pipefail
          registry_server=$(azd env get-value AZURE_CONTAINER_REGISTRY_ENDPOINT --environment "$AZURE_ENV_NAME")
          : "${registry_server:?Provisioning did not return the container registry endpoint}"
          arm_token=$(azd auth token --scope https://management.azure.com/.default --output json | jq -er '.token | select(type == "string" and length > 0)')
          echo "::add-mask::$arm_token"

          for app in api web; do
            app_url="https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.App/containerApps/${app}?api-version=2024-03-01"
            app_json=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $arm_token" "$app_url")

            if ! jq -e --arg server "$registry_server" '
              . as $app |
              any(.properties.configuration.registries[]?;
                .server == $server and
                (.identity | type == "string") and
                (.identity as $pull_identity |
                  ($app.identity.userAssignedIdentities // {}) | has($pull_identity))
              )
            ' <<< "$app_json" > /dev/null; then
              echo "::error::$app is missing a registry entry for $registry_server using an attached user-assigned identity. Image deployment has been stopped."
              jq '{app: .name, state: .properties.provisioningState,
                registries: .properties.configuration.registries,
                assignedIdentityIds: ((.identity.userAssignedIdentities // {}) | keys)}' <<< "$app_json"
              exit 1
            fi

            echo "$app: registry identity configuration verified for $registry_server"
          done

      - name: Deploy services
        run: azd deploy --environment "$AZURE_ENV_NAME" --all --no-prompt
