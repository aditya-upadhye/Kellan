name: Simulation realism

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realism:
    name: Full 50-seed realism sweep
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KELLAN_REALISM_SEED_COUNT: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make backend-setup
      - name: Run the full seeded realism sweep
        run: uv run --directory backend pytest tests/unit/sim/test_realism.py -m slow -v --durations=20
