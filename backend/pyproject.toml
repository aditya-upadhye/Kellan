[project]
name = "matchlens"
version = "0.1.0"
description = "Fact-checked, personalized football insights from a synthetic event stream."
authors = [{ name = "Aditya Upadhye" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[project.scripts]
matchlens = "matchlens.cli:main"

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchlens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RET", "PIE", "PT",
    "PTH", "ASYNC", "TID", "TC", "ERA", "PL", "RUF",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not azure"]
markers = [
    "azure: hits real Azure resources; run manually with `pytest -m azure`",
]

[tool.coverage.run]
source = ["matchlens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
