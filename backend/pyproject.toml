[project]
name = "matchlens"
version = "0.1.0"
description = "Fact-checked, personalized football insights from a synthetic event stream."
authors = [{ name = "Aditya Upadhye" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core==1.21.0",
    "fastapi==0.142.2",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
azure = [
    "azure-eventhub==5.15.1",
    "azure-cosmos[aio]==4.17.1",
    "azure-identity==1.26.0",
]
foundry = [
    "agent-framework-foundry==1.14.1",
    "azure-identity==1.26.0",
]

[project.scripts]
matchlens = "matchlens.cli:main"

[dependency-groups]
dev = [
    "hypothesis==6.168.3",
    "httpx2==2.13.1",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchlens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RET", "PIE", "PT",
    "PTH", "ASYNC", "TID", "TC", "ERA", "PL", "RUF",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]
"src/matchlens/llm/client.py" = ["PLR0913"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not azure"]
markers = [
    "azure: hits real Azure resources; run manually with `pytest -m azure`",
    "slow: simulates many matches or full tracking; skip locally with `-m \"not slow\"`",
]

[tool.coverage.run]
source = ["matchlens"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
