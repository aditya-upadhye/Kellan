services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LLM_MODE: ${LLM_MODE:-mock}
      TRANSPORT: ${TRANSPORT:-local}
      STORE: ${STORE:-memory}
      DATA_DIR: /app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MATCHLENS_WEB_PORT:-8080}:80"
